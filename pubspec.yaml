name: orbit_hop
description: A neon one-thumb planet-hopping arcade game built with Flutter and Flame.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.1'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  audioplayers: ^6.8.1
  google_mobile_ads: ^9.1.0
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.0
  firebase_core: ^4.15.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  games_services: ^5.3.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  cross_file: ^0.4.0
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/orbit_hop_icon.svg
